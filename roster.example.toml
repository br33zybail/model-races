# Example roster. These are the role names and prices from the gateway I ran
# the included results on. Your gateway will use other names: copy this file to
# roster.toml and edit it, or point RACE_ROSTER at your own file.
# Prices are USD per million tokens, [input, output]. Prices drift, so re-read
# them from your provider before you trust a cost figure.

[eval]
# Roles that run-evals raced by default.
roles = ["coder-local", "util-local", "reasoner-cheap", "reasoner-free", "coder-heavy",
         "coder-cheap", "coder-free", "longctx-cheap", "tool-fast", "tool-coder", "tool-glm"]

[eval.prices]
reasoner-cheap = [0.09, 0.18]
coder-heavy    = [0.54, 1.76]
coder-cheap    = [0.10, 0.28]
longctx-cheap  = [0.10, 0.40]
tool-fast      = [0.03, 0.14]
tool-coder     = [0.07, 0.27]
tool-glm       = [0.06, 0.40]
sonnet         = [2.00, 10.00]
haiku          = [1.00, 5.00]
ox-free        = [0.0, 0.0]

[judge]
primary   = "reasoner-free"   # scores the soft dimensions
secondary = "grok-shared"     # a different model family, used on close calls

[lanes]
# Head lanes in race_harness. cc_model goes to `claude -p --model`; the omp_*
# values go to `omp -p --model`. Each lane needs its CLI installed.
cc_model = "claude-fable-5"
omp_l2   = "fable"
omp_l3   = "reasoner-free"
omp_l3b  = "tool-coder"

[topology]
# Seats in topology_race.
solo          = "reasoner-fast"
finder        = "reasoner-fast"
verifier      = "grok-shared"
swarm_finders = ["tool-fast", "reasoner-fast", "tool-glm"]
swarm_judge   = "reasoner-fast"

[sweep]
# [label, model]. A model that starts with "ollama:" goes to Ollama directly.
cloud = [
  ["gpt-oss-120b [twin:local-120b]",     "reasoner-free"],
  ["gpt-oss-20b [twin:util-local]",      "tool-fast"],
  ["qwen3-coder-30b [twin:coder-local]", "tool-coder"],
  ["deepseek-v4-flash",                  "reasoner-cheap"],
  ["glm-5.2",                            "coder-heavy"],
  ["mimo-v2.5",                          "coder-cheap"],
  ["gemini-2.5-flash-lite",              "longctx-cheap"],
  ["glm-4.7-flash",                      "tool-glm"],
  ["kimi-k2.5",                          "openrouter/moonshotai/kimi-k2.5"],
  ["gpt-5.6-sol",                        "openrouter/openai/gpt-5.6-sol"],
  ["minimax-m2.5",                       "openrouter/minimax/minimax-m2.5"],
  ["grok-4.5 [xai-direct]",              "grok-shared"],
  ["claude-haiku-4.5",                   "haiku"],
]
local = [
  ["qwen3-coder-30b LOCAL", "ollama:qwen3-coder:30b"],
  ["gpt-oss-20b LOCAL",     "ollama:gpt-oss:20b"],
  ["gpt-oss-120b LOCAL",    "ollama:gpt-oss:120b"],
]

[tiers.prices]
# Models for tiers.py, the escalating tier race.
"openrouter/openai/gpt-5.6-luna"      = [1.00, 6.00]
"openrouter/openai/gpt-5.6-luna-pro"  = [1.00, 6.00]
"openrouter/openai/gpt-5.6-terra"     = [2.50, 15.00]
"openrouter/openai/gpt-5.6-terra-pro" = [2.50, 15.00]
"openrouter/openai/gpt-5.6-sol"       = [5.00, 30.00]
"openrouter/openai/gpt-5.6-sol-pro"   = [5.00, 30.00]
"openrouter/z-ai/glm-5.2"             = [0.54, 1.76]
"openrouter/openai/gpt-oss-120b:free" = [0.00, 0.00]
