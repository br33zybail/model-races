[project]
name = "model-races"
version = "0.1.0"
description = "Race candidate LLMs on fixture tasks graded by running code, before adopting one."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []            # standard library only

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["model_races"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
